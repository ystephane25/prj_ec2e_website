<!-- Page de demande de devis -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demande de devis | BTP</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <!-- Conteneur pour le header -->
  <div id="header-container"></div>

  <section class="max-w-xl mx-auto py-16 px-4">
    <h2 class="text-4xl font-bold mb-6">Demande de devis</h2>
    <form class="space-y-4">
      <input type="text" placeholder="Nom" class="w-full border px-4 py-2 rounded" required>
      <input type="email" placeholder="Email" class="w-full border px-4 py-2 rounded" required>
      <input type="text" placeholder="Téléphone" class="w-full border px-4 py-2 rounded">
      <textarea placeholder="Décrivez votre projet..." class="w-full border px-4 py-2 rounded h-32"></textarea>
      <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded">Envoyer</button>
    </form>
  </section>
  <!-- Conteneur pour le footer -->
  <div id="footer-container"></div>
  <!--#include file="footer.html" -->


 <script src="js/script.js"></script>

</body>
</html>
