<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demande de devis | EC2E/BTP</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- Header -->
  <div id="header-container"></div>

  <!-- Formulaire de devis -->
  <section class="max-w-xl mx-auto py-16 px-4">
    <h2 class="text-4xl font-bold mb-6 text-center text-blue-800">Demande de devis</h2>
    <p class="text-center text-gray-600 mb-10">
      Remplissez ce formulaire et nous reviendrons rapidement avec un devis personnalisé.
    </p>

    <form id="devisForm" class="space-y-4 bg-white p-6 rounded-lg shadow-lg">
      <div>
        <label for="name" class="block font-medium">Nom</label>
        <input id="name" name="user_name" type="text" placeholder="Votre nom"
          class="w-full border px-4 py-2 rounded" required>
      </div>

      <div>
        <label for="email" class="block font-medium">Email</label>
        <input id="email" name="user_email" type="email" placeholder="Votre email"
          class="w-full border px-4 py-2 rounded" required>
      </div>

      <div>
        <label for="phone" class="block font-medium">Téléphone</label>
        <input id="phone" name="user_phone" type="text" placeholder="Votre téléphone"
          class="w-full border px-4 py-2 rounded">
      </div>

      <div>
        <label for="message" class="block font-medium">Votre projet</label>
        <textarea id="message" name="project_message" placeholder="Décrivez votre projet..."
          class="w-full border px-4 py-2 rounded h-32" required></textarea>
      </div>

      <button type="submit"
        class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded transition duration-300 w-full">
        ✉️ Envoyer ma demande
      </button>
    </form>

    <div id="devisMessage" class="text-center mt-6 text-sm"></div>
  </section>

  <!-- Footer -->
  <div id="footer-container"></div>

  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <!-- Script de gestion du formulaire -->
  <script src="js/script.js"></script>
</body>
</html>
