<!-- Page de contact -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | BTP Élite</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <!-- Conteneur pour le header -->
  <div id="header-container"></div>

  <!-- Formulaire de contact -->
<section class="max-w-2xl mx-auto py-20 px-4" id="contact">
  <h2 class="text-4xl font-bold text-center text-blue-900 mb-6">Nous contacter</h2>
  <p class="text-center text-gray-600 mb-10">Une question ? Un projet ? Laissez-nous un message.</p>

  <form id="contactForm" class="space-y-6 bg-white shadow-md rounded-xl p-8">
    <!-- Nom -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Nom complet</label>
      <input type="text" name="user_name" required
        class="w-full border border-gray-300 rounded-lg py-3 px-4 focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>

    <!-- Email -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input type="email" name="user_email" required
        class="w-full border border-gray-300 rounded-lg py-3 px-4 focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>

    <!-- Message -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Message</label>
      <textarea name="message" rows="5" required
        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
    </div>

    <!-- Bouton -->
    <div class="text-center">
      <button type="submit"
        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-8 rounded-lg transition">
        ✉️ Envoyer le message
      </button>
    </div>
  </form>

  <div id="formMessage" class="text-center mt-6 text-sm"></div>
</section>

  
  <!-- Conteneur pour le footer -->
  <div id="footer-container"></div>
  <!--#include file="footer.html" -->
  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

 <script src="js/script.js"></script>

</body>
</html>
